name: macOS

# Runs the shared dictionary contract against the Swift implementation. The Windows
# workflow runs the identical vectors against the C# one. Both must be green for the two
# implementations to be considered in agreement — that pairing is the whole point.

on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Package.swift', '.github/workflows/macos.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Package.swift', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dictionary-contract:
    name: Dictionary contract
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Package.swift declares swift-tools-version 6.2, but the runner defaults to an
      # older Xcode (Swift 6.1) and fails to even parse the manifest. Select the newest
      # Xcode present rather than pinning a version that will age out of the image.
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Swift version
        run: swift --version

      # The runner must be macOS 26, not just any macOS. Package.swift declares
      # .macOS(.v26), so the test bundle is built for 26 — and an older runner cannot
      # dlopen it the moment the code touches a symbol the newer Swift runtime introduced.
      # That failed as "Symbol not found: EnumeratedSequence ... built for macOS 26.0 which
      # is newer than running OS", which reads like a code error and is an image mismatch.
      # It was latent until something used `.enumerated()`.
      #
      # The app target itself also needs macOS 26 and the Speech framework. BlurtDictionary,
      # BlurtSetup, BlurtInput and BlurtFormatting are platform-neutral in the sense that
      # they need no Speech or AppKit — not in the sense that they run on an older OS.
      #
      # Filtered by MODULE, not by suite name: a suite-name list silently stops covering a
      # new suite the moment someone adds one, and the run still goes green.
      - name: Test the platform-neutral targets
        run: swift test --filter '(BlurtDictionaryTests|BlurtSetupTests|BlurtInputTests|BlurtFormattingTests)'

      - name: Confirm the vectors on both sides are identical
        run: |
          if ! diff -q shared/dictionary-test-vectors.json Tests/BlurtDictionaryTests/dictionary-test-vectors.json; then
            echo "::error::The Swift test copy of the vectors has drifted from shared/."
            echo "Run: cp shared/dictionary-test-vectors.json Tests/BlurtDictionaryTests/"
            exit 1
          fi
          echo "Vectors match."
